<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
  <title>Mytragor HUD</title>
  <meta name="theme-color" content="#0b0f14"/>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png"/>
  <style>
    :root{
      --bg:#0b0f14; --card:#0f1722; --line:#1f2b3a; --text:#e8eef6; --muted:#9fb3c8;
      --arcana:#3b82f6; --marcial:#ef4444; --sombras:#374151; --religioso:#f59e0b;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color: transparent}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Arial,sans-serif;height:100%}
    body{overflow:hidden}
    .wrap{height:100vh;display:grid;grid-template-rows:10vh 24vh 44vh 22vh;gap:6px;padding:6px;max-width:560px;margin:0 auto}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;align-items:center;justify-content:center}
    .header{display:flex;align-items:center;justify-content:space-between;width:100%;padding:0 6px}
    .title{font-size:16px;margin:0}
    .mini{text-align:center;font-size:12px;color:var(--muted)}
    .row{display:flex;gap:6px;align-items:center;justify-content:space-between;width:100%}
    .lifeWrap{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
    .lifeCard{display:grid;grid-template-rows:auto 1fr auto;gap:2px;padding:6px}
    .life{font-size:36px;font-weight:900;text-align:center;border:2px solid var(--line);border-radius:12px;padding:4px 0;min-width:0}
    .name{font-size:12px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#d6e2f0}
    .aff{display:flex;gap:6px;justify-content:center}
    .aff .dot{width:14px;height:14px;border-radius:50%;border:1px solid var(--line);opacity:.9;cursor:pointer}
    .aff .dot.active{outline:2px solid white;outline-offset:1px}
    .bigbtn{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:#122035;color:var(--text);font-weight:900}
    .dice{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%}
    .dice .box{border:1px dashed var(--line);border-radius:10px;padding:8px;text-align:center;font-weight:800}
    .allies{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(5, 1fr);gap:6px;width:100%}
    .ally{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto 1fr;gap:4px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px;background:#0d1522;min-height:0}
    .ally .an{grid-column:1 / span 2;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#d6e2f0;cursor:pointer}
    .ally .val{justify-self:end;font-size:18px;font-weight:900;border:1px solid var(--line);border-radius:8px;padding:2px 6px;min-width:22px;text-align:center}
    .ally .btns{display:flex;gap:6px}
    .ally .btn{padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:#13243a;color:#e8eef6;font-weight:900}
    .footer{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%}
    .muted{color:var(--muted);font-size:11px;text-align:center}
    #install{position:fixed;bottom:12px;left:12px;right:12px;display:none}
  </style>
</head>
<body>
  <div class="wrap">
    <!-- 1) Header / D20 -->
    <div class="card">
      <div style="width:100%">
        <div class="header">
          <div>
            <div class="title">Mytragor — HUD</div>
            <div class="mini">Sem rolagem • Mobile • PWA</div>
          </div>
          <div class="dice">
            <button class="bigbtn" onclick="roll()">d20</button>
            <button class="bigbtn" onclick="rollPrecision()">Precisão</button>
          </div>
        </div>
        <div class="row mini" style="margin-top:4px">
          <div id="rollout" class="box" style="flex:1;text-align:center">—</div>
          <div id="rollout2" class="box" style="flex:1;text-align:center">—</div>
        </div>
      </div>
    </div>

    <!-- 2) Life row -->
    <div class="lifeWrap">
      <div class="card lifeCard" id="p1card">
        <div class="name" id="p1name" onclick="editName('p1')">Jogador 1</div>
        <div class="life" id="p1life">20</div>
        <div class="aff">
          <div class="dot" data-p="p1" data-aff="arcana" style="background:var(--arcana)"></div>
          <div class="dot" data-p="p1" data-aff="marcial" style="background:var(--marcial)"></div>
          <div class="dot" data-p="p1" data-aff="sombras" style="background:var(--sombras)"></div>
          <div class="dot" data-p="p1" data-aff="religioso" style="background:var(--religioso)"></div>
        </div>
        <div class="row" style="gap:6px;margin-top:4px">
          <button class="bigbtn" onclick="mod('p1',-1)">-1</button>
          <button class="bigbtn" onclick="mod('p1',+1)">+1</button>
        </div>
      </div>
      <div class="card lifeCard" id="p2card">
        <div class="name" id="p2name" onclick="editName('p2')">Jogador 2</div>
        <div class="life" id="p2life">20</div>
        <div class="aff">
          <div class="dot" data-p="p2" data-aff="arcana" style="background:var(--arcana)"></div>
          <div class="dot" data-p="p2" data-aff="marcial" style="background:var(--marcial)"></div>
          <div class="dot" data-p="p2" data-aff="sombras" style="background:var(--sombras)"></div>
          <div class="dot" data-p="p2" data-aff="religioso" style="background:var(--religioso)"></div>
        </div>
        <div class="row" style="gap:6px;margin-top:4px">
          <button class="bigbtn" onclick="mod('p2',-1)">-1</button>
          <button class="bigbtn" onclick="mod('p2',+1)">+1</button>
        </div>
      </div>
    </div>

    <!-- 3) Allies grid (10 tiles total) -->
    <div class="card" style="padding:6px">
      <div class="allies">
        <!-- P1 left / P2 right -->
        <!-- generated below with script if desired; here inline static for caching simplicity -->
        <div class="ally" data-p="p1" data-idx="0"><div class="an" onclick="editAlly('p1',0)">Aliado 1</div><div class="val">—</div><div class="btns"><button class="btn" onclick="allyDelta('p1',0,-1)">-1</button><button class="btn" onclick="allyDelta('p1',0,1)">+1</button></div></div>
        <div class="ally" data-p="p2" data-idx="0"><div class="an" onclick="editAlly('p2',0)">Aliado 1</div><div class="val">—</div><div class="btns"><button class="btn" onclick="allyDelta('p2',0,-1)">-1</button><button class="btn" onclick="allyDelta('p2',0,1)">+1</button></div></div>

        <div class="ally" data-p="p1" data-idx="1"><div class="an" onclick="editAlly('p1',1)">Aliado 2</div><div class="val">—</div><div class="btns"><button class="btn" onclick="allyDelta('p1',1,-1)">-1</button><button class="btn" onclick="allyDelta('p1',1,1)">+1</button></div></div>
        <div class="ally" data-p="p2" data-idx="1"><div class="an" onclick="editAlly('p2',1)">Aliado 2</div><div class="val">—</div><div class="btns"><button class="btn" onclick="allyDelta('p2',1,-1)">-1</button><button class="btn" onclick="allyDelta('p2',1,1)">+1</button></div></div>

        <div class="ally" data-p="p1" data-idx="2"><div class="an" onclick="editAlly('p1',2)">Aliado 3</div><div class="val">—</div><div class="btns"><button class="btn" onclick="allyDelta('p1',2,-1)">-1</button><button class="btn" onclick="allyDelta('p1',2,1)">+1</button></div></div>
        <div class="ally" data-p="p2" data-idx="2"><div class="an" onclick="editAlly('p2',2)">Aliado 3</div><div class="val">—</div><div class="btns"><button class="btn" onclick="allyDelta('p2',2,-1)">-1</button><button class="btn" onclick="allyDelta('p2',2,1)">+1</button></div></div>

        <div class="ally" data-p="p1" data-idx="3"><div class="an" onclick="editAlly('p1',3)">Aliado 4</div><div class="val">—</div><div class="btns"><button class="btn" onclick="allyDelta('p1',3,-1)">-1</button><button class="btn" onclick="allyDelta('p1',3,1)">+1</button></div></div>
        <div class="ally" data-p="p2" data-idx="3"><div class="an" onclick="editAlly('p2',3)">Aliado 4</div><div class="val">—</div><div class="btns"><button class="btn" onclick="allyDelta('p2',3,-1)">-1</button><button class="btn" onclick="allyDelta('p2',3,1)">+1</button></div></div>

        <div class="ally" data-p="p1" data-idx="4"><div class="an" onclick="editAlly('p1',4)">Aliado 5</div><div class="val">—</div><div class="btns"><button class="btn" onclick="allyDelta('p1',4,-1)">-1</button><button class="btn" onclick="allyDelta('p1',4,1)">+1</button></div></div>
        <div class="ally" data-p="p2" data-idx="4"><div class="an" onclick="editAlly('p2',4)">Aliado 5</div><div class="val">—</div><div class="btns"><button class="btn" onclick="allyDelta('p2',4,-1)">-1</button><button class="btn" onclick="allyDelta('p2',4,1)">+1</button></div></div>
      </div>
    </div>

    <!-- 4) Footer / Save / Install -->
    <div class="card footer">
      <button class="bigbtn" onclick="savePrefs()">Salvar</button>
      <button class="bigbtn" onclick="resetAll()">Reset</button>
    </div>
  </div>

  <button class="bigbtn" id="install">Instalar app</button>

<script>
  // --- PWA install prompt
  let deferredPrompt = null;
  const installBtn = document.getElementById('install');
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = 'block';
  });
  installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    installBtn.style.display = 'none';
  });
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>

<script>
  const get = id => document.getElementById(id)
  const clamp0 = v => Math.max(0, Math.min(999, v)) // não deixa negativo

  // Names
  function editName(p){
    const cur = get(p+'name').textContent
    const nn = prompt('Nome do '+(p==='p1'?'Jogador 1':'Jogador 2')+':', cur) 
    if(nn!==null){ get(p+'name').textContent = nn || (p==='p1'?'Jogador 1':'Jogador 2') }
  }
  function editAlly(p,i){
    const el = document.querySelector(`.ally[data-p="${p}"][data-idx="${i}"] .an`)
    const cur = el.textContent
    const nn = prompt('Nome do aliado:', cur)
    if(nn!==null){ el.textContent = nn || ('Aliado '+(i+1)) }
  }

  // D20
  function roll(){ const n = 1 + Math.floor(Math.random()*20); get('rollout').textContent = 'd20: '+n; return n }
  function rollPrecision(){ const a = roll(), b = roll(); const best = Math.max(a,b); get('rollout2').textContent = '2d20: '+a+' / '+b+' → '+best; return best }

  // Vitória
  function checkWinner(){
    const p1 = parseInt(get('p1life').textContent, 10)
    const p2 = parseInt(get('p2life').textContent, 10)
    if(p1===0 && p2>0){ alert((get('p2name').textContent || 'Jogador 2') + ' ganhou!') }
    else if(p2===0 && p1>0){ alert((get('p1name').textContent || 'Jogador 1') + ' ganhou!') }
    else if(p1===0 && p2===0){ alert('Empate: ambos chegaram a 0.') }
  }

  // Life (clamp em 0 e dispara vitória ao chegar a 0)
  function mod(p, d){
    const el = get(p+'life')
    let v = parseInt(el.textContent||'0',10)
    v = clamp0(v + d)
    el.textContent = v
    applyAffBorder(p)
    if(v===0) checkWinner()
  }

  // Allies (clamp em 0 e limpar ao chegar a 0)
  function allyDelta(p,i,d){
    const base = document.querySelector(`.ally[data-p="${p}"][data-idx="${i}"]`)
    const valEl = base.querySelector('.val')
    const nameEl = base.querySelector('.an')
    let v = valEl.textContent==='—' ? 0 : parseInt(valEl.textContent,10)
    v = clamp0(v + d)
    if(v===0){
      // limpa slot
      valEl.textContent = '—'
      nameEl.textContent = 'Aliado '+(i+1)
    }else{
      valEl.textContent = v
    }
    applyAffBorder(p)
  }

  // Affiliation dots → color
  function applyAffBorder(p){
    const color = state[p].color
    get(p+'life').style.borderColor = color
    document.querySelectorAll(`.ally[data-p="${p}"]`).forEach(a=>{
      const has = a.querySelector('.val').textContent !== '—'
      a.style.borderColor = has ? color : 'var(--line)'
    })
  }
  const state = {
    p1:{aff:'arcana', color:''},
    p2:{aff:'arcana', color:''}
  }
  function setAff(p,aff){
    state[p].aff = aff
    const color = getComputedStyle(document.documentElement).getPropertyValue('--'+aff).trim()
    state[p].color = color || '#6b7280'
    document.querySelectorAll(`.aff .dot[data-p="${p}"]`).forEach(d=>d.classList.toggle('active', d.getAttribute('data-aff')===aff))
    applyAffBorder(p)
  }

  // Save / Load
  function savePrefs(){
    const data = {
      p1:{
        name:get('p1name').textContent, life:get('p1life').textContent, aff:state.p1.aff,
        allies:[...document.querySelectorAll('.ally[data-p="p1"]')].map(a=>({name:a.querySelector('.an').textContent, life:a.querySelector('.val').textContent}))
      },
      p2:{
        name:get('p2name').textContent, life:get('p2life').textContent, aff:state.p2.aff,
        allies:[...document.querySelectorAll('.ally[data-p="p2"]')].map(a=>({name:a.querySelector('.an').textContent, life:a.querySelector('.val').textContent}))
      }
    }
    localStorage.setItem('mytragor_hud_pwa', JSON.stringify(data))
    alert('Salvo!')
  }
  function loadPrefs(){
    const raw = localStorage.getItem('mytragor_hud_pwa'); if(!raw) return
    try{
      const data = JSON.parse(raw)
      get('p1name').textContent = data.p1?.name || 'Jogador 1'
      get('p2name').textContent = data.p2?.name || 'Jogador 2'
      get('p1life').textContent = data.p1?.life || '20'
      get('p2life').textContent = data.p2?.life || '20'
      setAff('p1', data.p1?.aff || 'arcana')
      setAff('p2', data.p2?.aff || 'arcana')
      ;['p1','p2'].forEach(p=>{
        (data[p]?.allies||[]).forEach((al,i)=>{
          const base = document.querySelector(`.ally[data-p="${p}"][data-idx="${i}"]`)
          if(!base) return
          base.querySelector('.an').textContent = al.name || ('Aliado '+(i+1))
          base.querySelector('.val').textContent = al.life || '—'
        })
      })
      applyAffBorder('p1'); applyAffBorder('p2')
    }catch(e){}
  }

  function resetAll(){
    get('p1life').textContent = '20'; get('p2life').textContent='20'
    ;['p1','p2'].forEach(p=>{
      for(let i=0;i<5;i++){
        const base = document.querySelector(`.ally[data-p="${p}"][data-idx="${i}"]`)
        base.querySelector('.an').textContent = 'Aliado '+(i+1)
        base.querySelector('.val').textContent = '—'
      }
      setAff(p,'arcana')
    })
  }

  // Init
  window.addEventListener('load', ()=>{
    setAff('p1','arcana')
    setAff('p2','arcana')
    loadPrefs()
    document.querySelectorAll('.aff .dot').forEach(dot=>{
      dot.addEventListener('click', ()=> setAff(dot.dataset.p, dot.dataset.aff))
    })
  })
</script>
</body>
</html>
