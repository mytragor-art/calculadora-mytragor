<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
  <title>Mytragor HUD</title>
  <meta name="theme-color" content="#0b0f14"/>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png"/>
  <style>
    :root{
      /* Black & Gold theme */
      --bg:#050505; /* page background */
      --card-bg:#0b0b0b; /* card surface */
      --bg-soft:#111111;
      --line:rgba(212,175,55,0.14); /* subtle gold line */
      --text:#f3ebd7; /* warm off-white */
      --muted:rgba(243,235,215,0.62);
      --gold:#D4AF37; /* primary gold */
      --gold-deep:#b8860b;
      --gold-soft:rgba(212,175,55,0.18);
      --accent:#bdbdbd;
      --arcana:#3b82f6; --marcial:#ef4444; --sombras:#7c3aed; --religioso:#f59e0b;
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color: transparent}
    html,body{margin:0;padding:0;background:
      radial-gradient(900px 520px at 8% 10%, rgba(212,175,55,0.08), transparent 58%),
      radial-gradient(700px 460px at 92% 18%, rgba(124,58,237,0.10), transparent 56%),
      linear-gradient(180deg, #130f0a 0%, #080808 35%, #050505 100%);
      color:var(--text);font-family:"Trebuchet MS","Segoe UI",Tahoma,sans-serif;height:100%}
    body{overflow:hidden}
    body::before,
    body::after{content:"";position:fixed;inset:auto;pointer-events:none;z-index:0;opacity:.45}
    body::before{top:-120px;left:-120px;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle, rgba(212,175,55,0.10), transparent 68%);filter:blur(8px)}
    body::after{right:-80px;bottom:-90px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle, rgba(59,130,246,0.08), transparent 70%);filter:blur(12px)}

    /* layout: fixed header, fixed life row, allies fills remaining, fixed footer */
    .wrap{position:relative;z-index:1;height:100vh;height:100dvh;display:grid;grid-template-rows:118px 132px 1fr 72px;gap:14px;padding:14px;max-width:760px;margin:0 auto;min-width:320px}

    .card{position:relative;background:
      linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01) 18%, rgba(0,0,0,0.16) 100%),
      linear-gradient(135deg, rgba(212,175,55,0.04), transparent 35%),
      var(--card-bg);
      border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;align-items:center;justify-content:center;
      box-shadow:0 18px 40px rgba(0,0,0,0.58), inset 0 1px 0 rgba(255,255,255,0.06), inset 0 0 0 1px rgba(212,175,55,0.05);min-height:0;overflow:hidden}
    .card::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;background:linear-gradient(135deg, rgba(212,175,55,0.34), transparent 28%, transparent 72%, rgba(212,175,55,0.22));-webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;opacity:.8}

    /* specific card slots to avoid overlap */
    .header-card{align-items:center;justify-content:flex-start;padding:14px 16px}
    .header-card::after{content:"Mesa de batalha";position:absolute;right:18px;top:14px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:rgba(243,235,215,0.45)}
    .allies-card{display:flex;flex-direction:column;padding:14px 12px 12px;overflow:auto}
    .allies-card::before{content:"Aliados em campo";display:block;align-self:flex-start;margin:0 0 12px 4px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:rgba(243,235,215,0.56)}
    .life-row{display:block}

    .header{display:flex;align-items:center;justify-content:space-between;width:100%;padding:0 8px;gap:12px}
    .header-left{display:flex;flex-direction:column;gap:2px;min-width:0}
    .header-center{display:flex;flex-direction:column;align-items:center;gap:6px}
    .header-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:0}
    .title{font-size:28px;margin:0;color:#f4d98e;letter-spacing:0.10em;font-weight:800;font-family:"Palatino Linotype","Book Antiqua",Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
    .header-left .mini{font-size:11px;letter-spacing:.24em;text-transform:uppercase;text-align:left}
    .header-center .mini{padding:8px 14px;border:1px solid rgba(212,175,55,0.14);border-radius:999px;background:rgba(212,175,55,0.05);letter-spacing:.22em;text-transform:uppercase}
    @keyframes pulse-gold {
      0% { text-shadow: 0 0 4px rgba(212,175,55,0.12), 0 4px 12px rgba(0,0,0,0.55); transform: translateY(0); }
      50% { text-shadow: 0 0 8px rgba(212,175,55,0.16), 0 6px 16px rgba(0,0,0,0.56); transform: translateY(-0.6px); }
      100% { text-shadow: 0 0 4px rgba(212,175,55,0.12), 0 4px 12px rgba(0,0,0,0.55); transform: translateY(0); }
    }
    .title.pulse{animation: pulse-gold 6s ease-in-out infinite}
    .mini{text-align:center;font-size:12px;color:var(--muted)}

    .row{display:flex;gap:8px;align-items:center;justify-content:space-between;width:100%;min-width:0}
    .lifeWrap{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:14px;width:100%}
    .lifeCard{display:flex;flex-direction:column;gap:10px;padding:10px;min-height:0;align-items:stretch;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(212,175,55,0.02) 60%, rgba(0,0,0,0.18))}
    .lifeCard::after{content:"";position:absolute;left:14px;right:14px;top:0;height:1px;background:linear-gradient(90deg, transparent, rgba(212,175,55,0.28), transparent)}

    .life{font-size:40px;font-weight:900;text-align:center;border:2px solid rgba(212,175,55,0.12);border-radius:16px;padding:10px 4px;min-width:0;color:var(--gold);background:linear-gradient(180deg, rgba(212,175,55,0.10), rgba(212,175,55,0.02));text-shadow:0 10px 22px rgba(0,0,0,0.58);box-shadow:inset 0 1px 0 rgba(255,255,255,0.05)}

    /* half-life warning: when life <= 10 */
    .life.low{color:var(--marcial);border-color:var(--marcial);background:linear-gradient(180deg, rgba(239,68,68,0.06), transparent);box-shadow:0 8px 28px rgba(239,68,68,0.08)}

    .name{font-size:13px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#f6edd6;cursor:pointer;font-weight:700;letter-spacing:.04em}
    .chosen{font-size:11px;text-align:center;color:var(--gold);border:1px dashed rgba(212,175,55,0.18);border-radius:12px;padding:8px 10px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:linear-gradient(180deg, rgba(212,175,55,0.08), rgba(212,175,55,0.02));box-shadow:inset 0 1px 0 rgba(255,255,255,0.04)}

    .bigbtn{flex:1;padding:12px;border-radius:14px;border:1px solid rgba(212,175,55,0.16);background:linear-gradient(180deg, rgba(212,175,55,0.16), rgba(212,175,55,0.04));color:#f3db9d;font-weight:800;cursor:pointer;transition:transform .12s ease, box-shadow .12s ease, border-color .12s ease;box-shadow:inset 0 1px 0 rgba(255,255,255,0.05)}
    .bigbtn:hover{transform:translateY(-2px);box-shadow:0 12px 26px rgba(0,0,0,0.44);border-color:rgba(212,175,55,0.28)}

    /* smaller controls inside life cards to prevent overflow */
    .lifeCard .bigbtn{padding:10px;font-size:16px;border-radius:10px;box-sizing:border-box}
    .lifeCard .row{display:flex;gap:6px;align-items:center;justify-content:space-between}
    .lifeCard .row .bigbtn{flex:1;min-width:0}

    .dice{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
    .dice .box{border:1px dashed rgba(212,175,55,0.06);border-radius:10px;padding:10px;text-align:center;font-weight:800;background:transparent;color:var(--accent)}
    .box{border:1px dashed rgba(212,175,55,0.06);border-radius:10px;padding:8px 10px;text-align:center;font-weight:800;background:transparent;color:var(--accent)}
    .box.highlight{box-shadow:0 0 18px rgba(212,175,55,0.45);border-color:var(--gold-deep);transition:box-shadow .4s ease}

    /* d20 circular button */
    .d20-btn:active{transform:scale(.98)}
    .d20-face{font-size:22px;letter-spacing:1px}
    .d20-btn.rolling{animation: d20-roll 0.9s cubic-bezier(.2,.8,.2,1)}
    @keyframes d20-roll{0%{transform:rotate(0) scale(1)}25%{transform:rotate(15deg) scale(1.02)}50%{transform:rotate(-18deg) scale(1.04)}75%{transform:rotate(8deg) scale(1.02)}100%{transform:rotate(0) scale(1)}}
    /* SVG d20 styling */
    .d20-btn{background:transparent;border:1px solid rgba(212,175,55,0.06);padding:6px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;appearance:none;-webkit-appearance:none}
    .d20-svg{width:72px;height:72px;display:block;background:transparent}
    .d20-svg .face{fill:url(#goldGrad2);stroke:rgba(0,0,0,0.28);stroke-width:1}
    .d20-svg .edge{fill:rgba(0,0,0,0.06)}
    .d20-svg .num{
      fill:var(--text);
      stroke:rgba(0,0,0,0.7);
      stroke-width:1px;
      stroke-linejoin:round;
      paint-order:stroke fill;
      font-weight:900;
      font-size:18px;
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial;
      transform-origin:50% 50%;
      transform-box:fill-box;
      transition:transform .22s cubic-bezier(.2,.9,.2,1);
      text-rendering:optimizeLegibility;
      shape-rendering:geometricPrecision;
    }
    .d20-svg .num.pop{transform:scale(1.35)}

    .precision-btn{padding:8px 12px;border-radius:10px;border:1px solid rgba(212,175,55,0.12);background:transparent;color:var(--muted);font-weight:800;cursor:pointer}

    .allies{display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));grid-auto-rows:minmax(58px, auto);gap:10px;width:100%;min-height:0;padding:0;margin:0}
    .ally{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto 1fr;gap:8px;align-items:center;border:1px solid rgba(255,255,255,0.04);border-radius:16px;padding:10px;background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(0,0,0,0.10));min-height:52px;transition:transform .15s ease, border-color .15s ease, box-shadow .15s ease}
    .ally.neutral-filled{background:linear-gradient(180deg, rgba(156,163,175,0.16), rgba(55,65,81,0.14));}
    .ally:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(0,0,0,0.42)}
    .ally .an{grid-column:1 / span 2;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#f2ead6;cursor:pointer;font-weight:700}
    .ally .val{justify-self:end;font-size:20px;font-weight:900;border:1px solid rgba(212,175,55,0.10);border-radius:12px;padding:5px 9px;min-width:34px;text-align:center;color:var(--gold);background:linear-gradient(180deg, rgba(212,175,55,0.08), transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,0.04)}
    .ally.neutral-filled .val{color:#e5e7eb;border-color:rgba(156,163,175,0.45);background:linear-gradient(180deg, rgba(156,163,175,0.18), rgba(55,65,81,0.18));}
    .ally .btns{display:flex;gap:8px}
    .ally .btn{padding:8px 12px;border-radius:12px;border:1px solid rgba(255,255,255,0.06);background:linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));color:var(--text);font-weight:800;cursor:pointer}

    .footer{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;align-items:center;padding:10px}
    .muted{color:var(--muted);font-size:11px;text-align:center}
    #install{position:fixed;bottom:16px;left:16px;right:16px;display:none}
    .editor-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.78);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
    .editor-backdrop.open{display:flex}
    .editor-modal{width:min(100%, 360px);background:linear-gradient(180deg, rgba(22,22,22,0.98), rgba(5,5,5,0.98));border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 18px 48px rgba(0,0,0,0.72)}
    .editor-title{font-size:14px;font-weight:800;color:var(--gold);margin-bottom:10px}
    .editor-input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid rgba(212,175,55,0.18);background:#111;color:var(--text);font-size:16px;outline:none}
    .editor-help{margin-top:8px;font-size:12px;color:var(--muted);min-height:18px}
    .editor-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
    /* Responsive adjustments for small screens */
    @media (max-width:480px){
      .wrap{padding:6px;max-width:420px;grid-template-rows:54px 168px 1fr 46px;gap:5px;height:100vh;height:100dvh}
      .card{border-radius:14px;padding:6px}
      .header-card{padding:8px 10px}
      .header-card::after{top:8px;right:10px;font-size:8px;letter-spacing:.16em}
      .allies-card{padding:5px 6px 4px;overflow:hidden}
      .allies-card::before{margin:0 0 4px 2px;font-size:8px;letter-spacing:.16em}
      .header{padding:0 4px;gap:6px}
      .header-left{min-width:0}
      .header-right{display:none}
      .title{font-size:16px;letter-spacing:.07em}
      .header-center .mini{padding:4px 8px;font-size:9px}
      .lifeWrap{gap:6px;align-items:stretch}
      .lifeCard{gap:6px;padding:8px 6px;border-radius:14px;min-height:168px;justify-content:space-between}
      .lifeCard::after{left:10px;right:10px}
      .name{font-size:9px;letter-spacing:.01em;line-height:1.05}
      .chosen{font-size:8px;padding:5px 6px;border-radius:10px;white-space:normal;line-height:1.15;min-height:42px;display:flex;align-items:center;justify-content:center;text-align:center}
      .d20-btn{width:84px;height:84px;font-size:16px;border-width:2px}
      .d20-svg{width:72px;height:72px}
      .d20-svg .num{font-size:20px}
      .d20-face{font-size:16px}
      .bigbtn{padding:7px;border-radius:10px;font-size:12px}
      .precision-btn{padding:6px 10px;font-size:14px}
      .life{font-size:24px;padding:5px 4px;border-radius:12px}
      .lifeCard .row{gap:4px;margin-top:0}
      .lifeCard .bigbtn{display:flex;align-items:center;justify-content:center;padding:6px 5px;font-size:10px;line-height:1;min-height:28px;border-radius:9px}
      .dice{grid-template-columns:1fr;gap:6px}
      .allies{grid-template-columns:repeat(2, minmax(0, 1fr));grid-auto-rows:minmax(40px, auto);gap:4px;padding:0}
      .ally{grid-template-columns:minmax(0, 1fr) auto;grid-template-rows:auto auto;min-height:40px;padding:4px;gap:4px;border-radius:11px}
      .ally .an{grid-column:1 / span 2;grid-row:1;font-size:9px;line-height:1.08;white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
      .ally .val{grid-column:2;grid-row:2;font-size:13px;min-width:22px;padding:2px 5px;border-radius:8px;align-self:center}
      .ally .btns{grid-column:1;grid-row:2;gap:3px;align-self:center}
      .ally .btn{padding:5px 7px;border-radius:8px;font-size:10px}
      .footer{grid-template-columns:1fr 1fr;gap:6px;padding:4px}
      .footer .bigbtn{width:100%}
      .row.mini{flex-direction:column;gap:6px}
      .box{width:100%}
    }

    @media (max-width:390px){
      .wrap{grid-template-rows:50px 154px 1fr 42px;gap:4px;padding:4px}
      .title{font-size:14px}
      .header-center .mini{padding:3px 7px;font-size:8px}
      .lifeWrap{gap:5px}
      .lifeCard{padding:7px 5px;gap:6px;min-height:154px}
      .name{font-size:8px;line-height:1.02}
      .chosen{font-size:7px;padding:5px 4px;min-height:40px;line-height:1.1}
      .life{font-size:21px;padding:5px 3px}
      .lifeCard .row{gap:3px}
      .lifeCard .bigbtn{display:flex;align-items:center;justify-content:center;padding:5px 4px;font-size:9px;line-height:1;min-height:26px}
      .allies-card{padding:4px 5px 3px}
      .allies-card::before{font-size:7px;margin:0 0 3px 2px}
      .allies{grid-auto-rows:minmax(36px, auto);gap:3px}
      .ally{min-height:36px;padding:4px;gap:3px}
      .ally .an{font-size:8px}
      .ally .val{font-size:12px;min-width:20px;padding:2px 4px}
      .ally .btn{padding:4px 5px;font-size:9px}
      .footer{gap:5px;padding:3px}
      .footer .bigbtn{font-size:11px;padding:6px}
    }
  </style>
  
</head>
<body>
  <div class="wrap">
    <!-- 1) Header / D20 -->
    <div class="card header-card">
      <div style="width:100%">
        <div class="header">
          <div class="header-left">
            <div class="title pulse">Mytragor</div>
          </div>

          <div class="header-center" style="align-items:center">
            <div class="mini">HUD</div>
          </div>

          <div class="header-right">
            <div style="display:flex;gap:8px;align-items:center">
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 2) Life row -->
    <div class="lifeWrap life-row">
      <div class="card lifeCard" id="p1card">
        <div class="name" id="p1name" onclick="editName('p1')">Jogador 1</div>
        <div class="chosen" id="p1chosen" onclick="editChosen('p1')">Escolhido: Nenhum</div>
        <div class="life" id="p1life">30</div>
        <div class="row" style="gap:6px;margin-top:4px">
          <button class="bigbtn" onclick="mod('p1',-1)" data-player="p1" data-delta="-1">-1</button>
          <button class="bigbtn" onclick="mod('p1',+1)" data-player="p1" data-delta="1">+1</button>
        </div>
      </div>
      <div class="card lifeCard" id="p2card">
        <div class="name" id="p2name" onclick="editName('p2')">Jogador 2</div>
        <div class="chosen" id="p2chosen" onclick="editChosen('p2')">Escolhido: Nenhum</div>
        <div class="life" id="p2life">30</div>
        <div class="row" style="gap:6px;margin-top:4px">
          <button class="bigbtn" onclick="mod('p2',-1)" data-player="p2" data-delta="-1">-1</button>
          <button class="bigbtn" onclick="mod('p2',+1)" data-player="p2" data-delta="1">+1</button>
        </div>
      </div>
    </div>

    <!-- 3) Allies grid (10 tiles total) -->
    <div class="card allies-card" style="padding:6px">
      <div class="allies">
        <!-- P1 left / P2 right -->
        <!-- generated below with script if desired; here inline static for caching simplicity -->
        <div class="ally" data-p="p1" data-idx="0"><div class="an" onclick="editAlly('p1',0)">Aliado 1</div><div class="val">—</div><div class="btns"><button class="btn" onclick="allyDelta('p1',0,-1)">-1</button><button class="btn" onclick="allyDelta('p1',0,1)">+1</button></div></div>
        <div class="ally" data-p="p2" data-idx="0"><div class="an" onclick="editAlly('p2',0)">Aliado 1</div><div class="val">—</div><div class="btns"><button class="btn" onclick="allyDelta('p2',0,-1)">-1</button><button class="btn" onclick="allyDelta('p2',0,1)">+1</button></div></div>

        <div class="ally" data-p="p1" data-idx="1"><div class="an" onclick="editAlly('p1',1)">Aliado 2</div><div class="val">—</div><div class="btns"><button class="btn" onclick="allyDelta('p1',1,-1)">-1</button><button class="btn" onclick="allyDelta('p1',1,1)">+1</button></div></div>
        <div class="ally" data-p="p2" data-idx="1"><div class="an" onclick="editAlly('p2',1)">Aliado 2</div><div class="val">—</div><div class="btns"><button class="btn" onclick="allyDelta('p2',1,-1)">-1</button><button class="btn" onclick="allyDelta('p2',1,1)">+1</button></div></div>

        <div class="ally" data-p="p1" data-idx="2"><div class="an" onclick="editAlly('p1',2)">Aliado 3</div><div class="val">—</div><div class="btns"><button class="btn" onclick="allyDelta('p1',2,-1)">-1</button><button class="btn" onclick="allyDelta('p1',2,1)">+1</button></div></div>
        <div class="ally" data-p="p2" data-idx="2"><div class="an" onclick="editAlly('p2',2)">Aliado 3</div><div class="val">—</div><div class="btns"><button class="btn" onclick="allyDelta('p2',2,-1)">-1</button><button class="btn" onclick="allyDelta('p2',2,1)">+1</button></div></div>

        <div class="ally" data-p="p1" data-idx="3"><div class="an" onclick="editAlly('p1',3)">Aliado 4</div><div class="val">—</div><div class="btns"><button class="btn" onclick="allyDelta('p1',3,-1)">-1</button><button class="btn" onclick="allyDelta('p1',3,1)">+1</button></div></div>
        <div class="ally" data-p="p2" data-idx="3"><div class="an" onclick="editAlly('p2',3)">Aliado 4</div><div class="val">—</div><div class="btns"><button class="btn" onclick="allyDelta('p2',3,-1)">-1</button><button class="btn" onclick="allyDelta('p2',3,1)">+1</button></div></div>

        <div class="ally" data-p="p1" data-idx="4"><div class="an" onclick="editAlly('p1',4)">Aliado 5</div><div class="val">—</div><div class="btns"><button class="btn" onclick="allyDelta('p1',4,-1)">-1</button><button class="btn" onclick="allyDelta('p1',4,1)">+1</button></div></div>
        <div class="ally" data-p="p2" data-idx="4"><div class="an" onclick="editAlly('p2',4)">Aliado 5</div><div class="val">—</div><div class="btns"><button class="btn" onclick="allyDelta('p2',4,-1)">-1</button><button class="btn" onclick="allyDelta('p2',4,1)">+1</button></div></div>
      </div>
    </div>

    <!-- 4) Footer / Save / Install -->
    <div class="card footer">
      <button class="bigbtn" onclick="resetAll()">Reset</button>
      <button class="bigbtn" onclick="savePrefs()">Salvar</button>
    </div>
  </div>

  <button class="bigbtn" id="install">Instalar app</button>

  <div class="editor-backdrop" id="nameEditor" aria-hidden="true">
    <div class="editor-modal">
      <div class="editor-title" id="editorTitle">Editar nome</div>
      <input class="editor-input" id="editorInput" type="text" maxlength="40" autocomplete="off" />
      <datalist id="editorSuggestions"></datalist>
      <div class="editor-help" id="editorHelp"></div>
      <div class="editor-actions">
        <button class="bigbtn" type="button" onclick="closeNameEditor()">Cancelar</button>
        <button class="bigbtn" type="button" onclick="saveNameEditor()">Salvar</button>
      </div>
    </div>
  </div>

  

<script>
  // --- PWA install prompt
  let deferredPrompt = null;
  const installBtn = document.getElementById('install');
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = 'block';
  });
  installBtn.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    installBtn.style.display = 'none';
  });
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>

<script src="./data/chosen.js"></script>
<script src="./data/allies.js"></script>

<script>
  const get = id => document.getElementById(id)
  const clamp0 = v => Math.max(0, Math.min(999, v)) // não deixa negativo
  const NEUTRAL_AFF = 'neutro'
  const nameEditorState = { mode: null, player: null, index: null }
  const CHOSEN_CATALOG = globalThis.MYTRAGOR_CHOSEN || []
  const ALLY_SUGGESTIONS = globalThis.MYTRAGOR_ALLIES || []

  function getAllyCatalogEntry(name){
    const normalized = (name || '').trim().toLowerCase()
    return ALLY_SUGGESTIONS.find(entry => entry.name.toLowerCase() === normalized)
  }

  function getAffColor(aff){
    if(aff === NEUTRAL_AFF) return '#9ca3af'
    return getComputedStyle(document.documentElement).getPropertyValue('--'+aff).trim() || '#6b7280'
  }

  function getAllowedAllySuggestions(player){
    const playerAff = state[player]?.aff || 'arcana'
    return ALLY_SUGGESTIONS.filter(entry => entry.aff === playerAff || entry.aff === NEUTRAL_AFF)
  }

  function populateSuggestions(mode, player){
    const list = get('editorSuggestions')
    let items = []
    let help = ''
    if(mode === 'ally'){
      items = getAllowedAllySuggestions(player).map(entry => entry.name)
      help = 'Aliados sugeridos: mesma filiacao do escolhido e neutros.'
    }
    if(mode === 'chosen'){
      items = CHOSEN_CATALOG.map(entry => entry.name)
      help = 'Ao escolher um nome da lista, a cor muda automaticamente.'
    }
    list.innerHTML = items.map(item => `<option value="${item}"></option>`).join('')
    get('editorInput').setAttribute('list', items.length ? 'editorSuggestions' : '')
    get('editorHelp').textContent = help
  }

  function setChosen(p, chosenName, options = {}){
    const label = get(p+'chosen')
    const normalized = (chosenName || '').trim()
    label.textContent = normalized ? `Escolhido: ${normalized}` : 'Escolhido: Nenhum'
    if(options.applyAffinity === false) return
    const match = CHOSEN_CATALOG.find(entry => entry.name.toLowerCase() === normalized.toLowerCase())
    if(match){
      setAff(p, match.aff)
    }
  }

  function openNameEditor(title, value, mode, player, index){
    nameEditorState.mode = mode
    nameEditorState.player = player
    nameEditorState.index = index ?? null
    get('editorTitle').textContent = title
    get('editorInput').value = value
    populateSuggestions(mode, player)
    get('nameEditor').classList.add('open')
    get('nameEditor').setAttribute('aria-hidden', 'false')
    requestAnimationFrame(() => {
      get('editorInput').focus()
      get('editorInput').select()
    })
  }

  function closeNameEditor(){
    get('nameEditor').classList.remove('open')
    get('nameEditor').setAttribute('aria-hidden', 'true')
    get('editorInput').removeAttribute('list')
    get('editorHelp').textContent = ''
    nameEditorState.mode = null
    nameEditorState.player = null
    nameEditorState.index = null
  }

  function saveNameEditor(){
    const player = nameEditorState.player
    const value = get('editorInput').value.trim()
    if(nameEditorState.mode === 'player' && player){
      get(player+'name').textContent = value || (player === 'p1' ? 'Jogador 1' : 'Jogador 2')
    }
    if(nameEditorState.mode === 'ally' && player !== null && nameEditorState.index !== null){
      const allyEntry = getAllyCatalogEntry(value)
      const allowedNames = getAllowedAllySuggestions(player).map(entry => entry.name.toLowerCase())
      if(value && allyEntry && !allowedNames.includes(allyEntry.name.toLowerCase())){
        alert('Esse aliado nao pertence a filiacao do escolhido nem e neutro.')
        return
      }
      const allyBase = document.querySelector(`.ally[data-p="${player}"][data-idx="${nameEditorState.index}"]`)
      const allyName = document.querySelector(`.ally[data-p="${player}"][data-idx="${nameEditorState.index}"] .an`)
      const allyValue = allyBase?.querySelector('.val')
      if(allyName){
        allyName.textContent = value || ('Aliado '+(nameEditorState.index + 1))
      }
      if(allyValue){
        allyValue.textContent = value && allyEntry ? String(allyEntry.life) : '—'
      }
      applyAffBorder(player)
    }
    if(nameEditorState.mode === 'chosen' && player){
      setChosen(player, value)
    }
    closeNameEditor()
  }

  // Names
  function editName(p){
    const cur = get(p+'name').textContent
    openNameEditor('Nome do '+(p==='p1'?'Jogador 1':'Jogador 2'), cur, 'player', p)
  }
  function editAlly(p,i){
    const el = document.querySelector(`.ally[data-p="${p}"][data-idx="${i}"] .an`)
    const cur = el.textContent
    openNameEditor('Nome do aliado', cur, 'ally', p, i)
  }
  function editChosen(p){
    const cur = get(p+'chosen').textContent.replace(/^Escolhido:\s*/, '')
    openNameEditor('Nome do escolhido', cur === 'Nenhum' ? '' : cur, 'chosen', p)
  }

  // Vitória
  function checkWinner(){
    const p1 = parseInt(get('p1life').textContent, 10)
    const p2 = parseInt(get('p2life').textContent, 10)
    if(p1===0 && p2>0){ alert((get('p2name').textContent || 'Jogador 2') + ' ganhou!') }
    else if(p2===0 && p1>0){ alert((get('p1name').textContent || 'Jogador 1') + ' ganhou!') }
    else if(p1===0 && p2===0){ alert('Empate: ambos chegaram a 0.') }
  }

  // apply visual state for life (half warning)
  function applyLifeState(p){
    const el = get(p+'life')
    if(!el) return
    const v = parseInt(el.textContent||'0', 10)
    if(!isNaN(v) && v<=10){
      el.classList.add('low')
    }else{
      el.classList.remove('low')
    }
  }

  // Life (clamp em 0 e dispara vitória ao chegar a 0)
  function mod(p, d){
    const el = get(p+'life')
    let v = parseInt(el.textContent||'0',10)
    v = clamp0(v + d)
    el.textContent = v
    applyAffBorder(p)
    applyLifeState(p)
    if(v===0) checkWinner()
  }

  // Allies (clamp em 0 e limpar ao chegar a 0)
  function allyDelta(p,i,d){
    const base = document.querySelector(`.ally[data-p="${p}"][data-idx="${i}"]`)
    const valEl = base.querySelector('.val')
    const nameEl = base.querySelector('.an')
    let v = valEl.textContent==='—' ? 0 : parseInt(valEl.textContent,10)
    v = clamp0(v + d)
    if(v===0){
      // limpa slot
      valEl.textContent = '—'
      nameEl.textContent = 'Aliado '+(i+1)
    }else{
      valEl.textContent = v
    }
    applyAffBorder(p)
  }

  // Affiliation dots → color
  function applyAffBorder(p){
    const color = state[p].color || '#6b7280'
    // apply to life card
    const lifeEl = get(p+'life')
    if(lifeEl) lifeEl.style.borderColor = color
    // apply to ally slots: use solid color when value present, softer translucent when empty
    document.querySelectorAll(`.ally[data-p="${p}"]`).forEach(a=>{
      const val = a.querySelector('.val').textContent
      const allyName = a.querySelector('.an').textContent
      const allyEntry = getAllyCatalogEntry(allyName)
      const slotColor = allyEntry ? getAffColor(allyEntry.aff) : color
      const has = val !== '—' && val !== ''
      const isNeutral = allyEntry?.aff === NEUTRAL_AFF
      a.style.borderStyle = 'solid'
      a.classList.toggle('neutral-filled', has && isNeutral)
      if(has){
        a.style.borderColor = slotColor
        a.style.borderWidth = '2px'
        a.style.boxShadow = `0 10px 30px ${slotColor}55`
      }else{
        a.style.borderColor = color + '55'
        a.style.borderWidth = '1px'
        a.style.boxShadow = 'none'
      }
    })
  }
  const state = {
    p1:{aff:'arcana', color:''},
    p2:{aff:'arcana', color:''}
  }
  function setAff(p,aff){
    state[p].aff = aff
    const color = getComputedStyle(document.documentElement).getPropertyValue('--'+aff).trim()
    state[p].color = color || '#6b7280'
    applyAffBorder(p)
    const chosenEl = get(p+'chosen')
    if(chosenEl){
      chosenEl.style.borderColor = color + '88'
      chosenEl.style.color = color
      chosenEl.style.boxShadow = `0 8px 24px ${color}22`
    }
  }

  // Save / Load
  function savePrefs(){
    const data = {
      p1:{
        name:get('p1name').textContent, chosen:get('p1chosen').textContent.replace(/^Escolhido:\s*/, ''), life:get('p1life').textContent, aff:state.p1.aff,
        allies:[...document.querySelectorAll('.ally[data-p="p1"]')].map(a=>({name:a.querySelector('.an').textContent, life:a.querySelector('.val').textContent}))
      },
      p2:{
        name:get('p2name').textContent, chosen:get('p2chosen').textContent.replace(/^Escolhido:\s*/, ''), life:get('p2life').textContent, aff:state.p2.aff,
        allies:[...document.querySelectorAll('.ally[data-p="p2"]')].map(a=>({name:a.querySelector('.an').textContent, life:a.querySelector('.val').textContent}))
      }
    }
    localStorage.setItem('mytragor_hud_pwa', JSON.stringify(data))
    alert('Salvo!')
  }
  function loadPrefs(){
    const raw = localStorage.getItem('mytragor_hud_pwa'); if(!raw) return
    try{
      const data = JSON.parse(raw)
      get('p1name').textContent = data.p1?.name || 'Jogador 1'
      get('p2name').textContent = data.p2?.name || 'Jogador 2'
      setChosen('p1', data.p1?.chosen === 'Nenhum' ? '' : (data.p1?.chosen || ''), { applyAffinity:false })
      setChosen('p2', data.p2?.chosen === 'Nenhum' ? '' : (data.p2?.chosen || ''), { applyAffinity:false })
      get('p1life').textContent = data.p1?.life || '30'
      get('p2life').textContent = data.p2?.life || '30'
      const p1Chosen = CHOSEN_CATALOG.find(entry => entry.name.toLowerCase() === (data.p1?.chosen || '').toLowerCase())
      const p2Chosen = CHOSEN_CATALOG.find(entry => entry.name.toLowerCase() === (data.p2?.chosen || '').toLowerCase())
      setAff('p1', p1Chosen?.aff || data.p1?.aff || 'arcana')
      setAff('p2', p2Chosen?.aff || data.p2?.aff || 'arcana')
      ;['p1','p2'].forEach(p=>{
        (data[p]?.allies||[]).forEach((al,i)=>{
          const base = document.querySelector(`.ally[data-p="${p}"][data-idx="${i}"]`)
          if(!base) return
          base.querySelector('.an').textContent = al.name || ('Aliado '+(i+1))
          base.querySelector('.val').textContent = al.life || '—'
        })
      })
      applyAffBorder('p1'); applyAffBorder('p2')
      applyLifeState('p1'); applyLifeState('p2')
    }catch(e){}
  }

  function resetAll(){
    get('p1life').textContent = '30'; get('p2life').textContent='30'
    ;['p1','p2'].forEach(p=>{
      setChosen(p, '', { applyAffinity:false })
      for(let i=0;i<5;i++){
        const base = document.querySelector(`.ally[data-p="${p}"][data-idx="${i}"]`)
        base.querySelector('.an').textContent = 'Aliado '+(i+1)
        base.querySelector('.val').textContent = '—'
      }
      setAff(p,'arcana')
      applyLifeState(p)
    })
  }

  // Init
  window.addEventListener('load', ()=>{
    setAff('p1','arcana')
    setAff('p2','arcana')
    get('nameEditor').addEventListener('click', (event) => {
      if(event.target === get('nameEditor')) closeNameEditor()
    })
    get('editorInput').addEventListener('keydown', (event) => {
      if(event.key === 'Enter') saveNameEditor()
      if(event.key === 'Escape') closeNameEditor()
    })
    setupLongPressControls()
  })

  // Mobile: long-press support on life +/- buttons to apply ×5 (touch-friendly)
  function setupLongPressControls(){
    document.querySelectorAll('.lifeCard .bigbtn[data-player]').forEach(btn=>{
      let holdTimer = null
      let holdTriggered = false
      const player = btn.dataset.player
      const delta = parseInt(btn.dataset.delta || '0', 10)

      const clearHold = () => {
        if(holdTimer){
          clearTimeout(holdTimer)
          holdTimer = null
        }
      }

      btn.addEventListener('pointerdown', () => {
        holdTriggered = false
        clearHold()
        holdTimer = setTimeout(() => {
          holdTriggered = true
          mod(player, delta * 5)
        }, 450)
      })

      const stopHold = () => clearHold()
      btn.addEventListener('pointerup', stopHold)
      btn.addEventListener('pointerleave', stopHold)
      btn.addEventListener('pointercancel', stopHold)

      btn.addEventListener('click', (event) => {
        if(!holdTriggered) return
        event.preventDefault()
        event.stopImmediatePropagation()
        holdTriggered = false
      }, true)
    })
  }


  loadPrefs()
</script>
</body>
</html>
